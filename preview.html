<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#1A2E4A;--blue:#2B5EA7;--gold:#C9A84C;--gr:#1A6B4A;--bd:#D8E2EF;--sf:#F7F8FA;--tm:#6B7C93;--tx:#1E2A3A;--rd:#C0392B;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--sf);color:var(--tx);padding:20px;}
.page{max-width:900px;margin:0 auto;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 4px 30px rgba(0,0,0,.12);}
.qh{background:var(--navy);padding:26px 36px;display:flex;align-items:center;justify-content:space-between;}
.qh-logo{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold);letter-spacing:1px;}
.qh-sub{color:rgba(255,255,255,.4);font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-top:3px;}
.qh-right{text-align:right;}
.qh-type{font-family:'Cormorant Garamond',serif;font-size:20px;color:#fff;letter-spacing:3px;text-transform:uppercase;}
.qh-ref{font-size:11px;color:var(--gold);margin-top:4px;}
.gold-bar{height:4px;background:linear-gradient(90deg,var(--gold),#E8C86A,var(--gold));}
.ci{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--bd);}
.ci-block{padding:16px 28px;}
.ci-block:first-child{border-right:1px solid var(--bd);}
.ci-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--tm);margin-bottom:6px;}
.ci-name{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:2px;}
.ci-detail{font-size:11px;color:var(--tm);margin-bottom:1px;}
.ci-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 8px;border-radius:8px;margin-top:4px;background:#DBEAFE;color:#1E40AF;}
.dr{display:grid;grid-template-columns:repeat(5,1fr);background:var(--navy);padding:12px 28px;gap:10px;}
.dr-item{text-align:center;}
.dr-label{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.38);margin-bottom:4px;}
.dr-value{font-size:12px;font-weight:600;color:#fff;}
.dr-value.gold{color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:15px;}
.section{padding:18px 28px;border-bottom:1px solid var(--bd);}
.sec-title{display:flex;align-items:center;gap:8px;margin-bottom:11px;}
.sec-title h3{font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--navy);text-transform:uppercase;letter-spacing:1px;}
.sec-title .line{flex:1;height:1px;background:var(--bd);}
table.qt{width:100%;border-collapse:collapse;font-size:11px;}
table.qt thead tr{background:var(--sf);}
table.qt thead th{padding:6px 8px;text-align:left;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--tm);border-bottom:2px solid var(--bd);white-space:nowrap;}
table.qt thead th.rt{text-align:right;}
table.qt tbody tr{border-bottom:1px solid #F0F4FA;}
table.qt tbody tr:last-child{border-bottom:none;}
table.qt tbody td{padding:6px 8px;vertical-align:middle;}
table.qt tbody td.rt{text-align:right;}
.day-cell{font-size:9.5px;font-weight:700;color:var(--blue);white-space:nowrap;}
.date-cell{font-size:10px;color:var(--tm);white-space:nowrap;}
.hotel-name{font-weight:600;color:var(--tx);font-size:11px;}
.hotel-city{font-size:10px;color:var(--tm);}
.empty-row{text-align:center;color:var(--tm);font-style:italic;padding:12px!important;}
.sec-totals{margin-top:8px;background:linear-gradient(135deg,#F0F4FA,#E8EFF8);border-radius:5px;padding:6px 12px;display:flex;align-items:center;}
.st-block{flex:1;display:flex;align-items:center;gap:5px;padding:0 10px;border-right:1px solid #CDD8E8;}
.st-block:first-child{padding-left:4px;}
.st-block:last-child{border-right:none;}
.st-label{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--tm);white-space:nowrap;}
.st-value{font-size:11px;font-weight:700;color:var(--navy);}
.st-value.sell{color:var(--gr);}
.st-margin{display:flex;align-items:center;gap:2px;}
.st-margin input{width:36px;border:1px solid var(--bd);border-radius:3px;padding:1px 4px;font-size:10.5px;font-weight:700;color:var(--blue);text-align:center;background:#fff;outline:none;}
.inc-grid{display:flex;flex-wrap:wrap;gap:5px;}
.inc-chip{display:flex;align-items:center;gap:4px;padding:4px 9px;background:var(--sf);border:1px solid var(--bd);border-radius:4px;font-size:10.5px;}
.inc-chip::before{content:'✓';color:var(--gr);font-weight:700;font-size:10px;}
.gt-section{background:var(--navy);padding:18px 28px;}
.gt-title{font-family:'Cormorant Garamond',serif;font-size:15px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:13px;}
table.recap{width:100%;border-collapse:collapse;margin-bottom:14px;}
table.recap th{font-size:8.5px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.38);padding:5px 10px;text-align:right;border-bottom:1px solid rgba(255,255,255,.1);}
table.recap th:first-child{text-align:left;}
table.recap td{padding:6px 10px;font-size:11px;text-align:right;border-bottom:1px solid rgba(255,255,255,.05);color:rgba(255,255,255,.7);}
table.recap td:first-child{text-align:left;}
table.recap tr.total-row td{border-top:2px solid rgba(201,168,76,.5);font-weight:700;font-size:12.5px;color:#fff;padding-top:8px;}
.cv{color:var(--gold);font-weight:700;}
.pax-banner{background:linear-gradient(135deg,var(--gold),#E8C86A 50%,var(--gold));border-radius:5px;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;}
.pax-left .pax-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:rgba(26,46,74,.6);}
.pax-left .pax-note{font-size:10px;color:rgba(26,46,74,.5);margin-top:2px;}
.pax-right{display:flex;align-items:center;gap:16px;}
.pax-block{text-align:right;}
.pax-block .pcur{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(26,46,74,.5);}
.pax-block .pval{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:700;color:var(--navy);line-height:1.1;}
.pax-block .pval-sm{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--navy);line-height:1.1;}
.pax-div{width:1px;height:34px;background:rgba(26,46,74,.2);}
.qf{padding:13px 28px;display:flex;align-items:center;justify-content:space-between;background:#F8F6F0;border-top:1px solid var(--bd);}
.qf-agent strong{color:var(--navy);display:block;font-size:12px;font-weight:600;margin-bottom:1px;}
.qf-contact{font-size:10px;color:var(--tm);}
.qf-logo{font-family:'Cormorant Garamond',serif;font-size:12px;color:var(--tm);text-align:right;}
.toolbar{max-width:900px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.toolbar-left{font-size:13px;font-weight:600;color:var(--navy);}
.toolbar-right{display:flex;gap:8px;}
.btn{padding:8px 16px;border-radius:5px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .18s;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.btn-print{background:var(--navy);color:#fff;}
.btn-invoice{background:#7B2D8B;color:#fff;}
.btn-proposal{background:var(--gr);color:#fff;}
.modal-overlay{position:fixed;inset:0;background:rgba(10,20,40,.65);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:8px;width:100%;max-width:520px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.mhdr{background:var(--navy);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--gold);}
.mtit{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--gold);letter-spacing:1px;}
.mclose{background:none;border:none;color:rgba(255,255,255,.6);font-size:20px;cursor:pointer;}
.mbody{padding:20px;}
.lang-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px;}
.lang-card{border:2px solid var(--bd);border-radius:6px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .15s;}
.lang-card:hover,.lang-card.active{border-color:var(--blue);background:#E8EFF8;}
.lang-card .flag{font-size:22px;margin-bottom:4px;}
.lang-card .lname{font-size:11px;font-weight:600;color:var(--navy);}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;}
.field label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--tm);}
.field input{border:1px solid var(--bd);border-radius:4px;padding:7px 9px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--tx);background:var(--sf);outline:none;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.modal-actions .btn{flex:1;justify-content:center;padding:10px;}
.btn-cancel{background:var(--sf);color:var(--tx);border:1px solid var(--bd);}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:6px;font-size:12.5px;border-left:4px solid var(--gold);box-shadow:0 4px 20px rgba(0,0,0,.3);z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{border-left-color:#27AE60;}
.toast.error{border-left-color:var(--rd);}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@media print{body{padding:0;background:#fff;}.toolbar{display:none;}.page{box-shadow:none;border-radius:0;}}
</style>
</head>
<body>

<!-- MODALS -->
<div class="modal-overlay" id="moInvoice">
  <div class="modal">
    <div class="mhdr"><div class="mtit">📊 Generate Invoice</div><button class="mclose" onclick="closeMo('moInvoice')">✕</button></div>
    <div class="mbody">
      <div style="background:#FEF9EF;border:1px solid var(--gold);border-radius:5px;padding:11px 14px;margin-bottom:14px;font-size:12px;">
        <strong style="color:var(--navy);">Template selected automatically :</strong><br>
        <span id="invTplInfo" style="color:var(--tm);margin-top:3px;display:block;">—</span>
      </div>
      <div style="background:var(--navy);border-radius:6px;padding:14px 18px;margin-bottom:14px;color:#fff;">
        <div style="font-size:10px;color:rgba(255,255,255,.45);margin-bottom:3px;">TOTAL INVOICE</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold);font-weight:700;" id="invTotal">—</div>
        <div style="font-size:10.5px;color:rgba(255,255,255,.5);margin-top:4px;font-style:italic;" id="invWords">—</div>
      </div>
      <div style="font-size:11.5px;color:var(--tm);margin-bottom:14px;line-height:1.6;" id="invSummary"></div>
      <div class="modal-actions">
        <button class="btn btn-invoice" id="btnGenInvoice" onclick="doGenerateInvoice()">📊 Generate Excel Invoice</button>
        <button class="btn btn-cancel" onclick="closeMo('moInvoice')">Cancel</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="moProposal">
  <div class="modal">
    <div class="mhdr"><div class="mtit">📝 Client Proposal</div><button class="mclose" onclick="closeMo('moProposal')">✕</button></div>
    <div class="mbody">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--tm);margin-bottom:9px;">Select language</div>
      <div class="lang-grid">
        <div class="lang-card active" id="lc-en" onclick="selLang('en')"><div class="flag">🇬🇧</div><div class="lname">English</div></div>
        <div class="lang-card" id="lc-fr" onclick="selLang('fr')"><div class="flag">🇫🇷</div><div class="lname">Français</div></div>
        <div class="lang-card" id="lc-es" onclick="selLang('es')"><div class="flag">🇪🇸</div><div class="lname">Español</div></div>
        <div class="lang-card" id="lc-pt" onclick="selLang('pt')"><div class="flag">🇧🇷</div><div class="lname">Português</div></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-proposal" id="btnGenProposal" onclick="doGenerateProposal()">📝 Generate Proposal</button>
        <button class="btn btn-cancel" onclick="closeMo('moProposal')">Cancel</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="toolbar no-print">
  <div class="toolbar-left" id="toolbar-title">📄 Quotation Preview</div>
  <div class="toolbar-right">
    <button class="btn btn-print" onclick="window.print()">🖨 Print / PDF</button>
    <button class="btn btn-invoice" onclick="openInvoiceModal()">📊 Generate Invoice</button>
    <button class="btn btn-proposal" onclick="openProposalModal()">📝 Client Proposal</button>
  </div>
</div>

<div class="page" id="quotation-page"></div>

<script data-cfasync="false">
try{const stored=localStorage.getItem('vm_preview_data');if(stored)window._PD=JSON.parse(stored);}catch(e){console.error('localStorage error:',e);}

const d=window._PD||{};
const roundUp10=n=>Math.ceil(Number(n||0)/10)*10;
const fmt=(n,dec=2,round=false)=>{const val=round?roundUp10(n):Number(n||0);return val.toLocaleString('fr-MA',{minimumFractionDigits:round?0:dec,maximumFractionDigits:round?0:dec});};
const fmtR=n=>fmt(n,0,true);
const fmtDate=s=>{try{return new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return s||'—';}};
const sell=(c,m)=>m<100?c/(1-(m/100)):c;

const Q={
  ref:d.ref||'QT-001',version:d.version||'v1',
  date:fmtDate(d.quoteDate)||'—',
  status:d.status||'draft',
  client:d.client||'—',contact:d.contact||'—',
  paxNames:d.paxNames||d.client||'—',
  pax:parseInt(d.pax)||2,
  arr:d.arr||'',dep:d.dep||'',
  numDays:parseInt(d.numDays)||0,numCats:parseInt(d.numCats)||1,
  currency:d.currency||'EUR',rate:parseFloat(d.rate)||10.5,
  agent:d.agent||'Agent Visit Morocco',
  agentPhone:d.agentPhone||'+212 524 42 03 87',
  agentMobile:d.agentMobile||'+212 665 877 863',
  agentEmail:d.agentEmail||'incoming@visitmoroccodmc.com',
  accomData:d.accomData||{},transData:d.transData||{},
  actData:d.actData||[],
  extData:d.extData||[],
  mealsData:d.mealsData||[],
  incLines:d.incLines||[],
  marginAccom:parseFloat(d.marginAccom)||0,
  marginTrans:parseFloat(d.marginTrans)||20,
  marginAct:parseFloat(d.marginAct)||20,
  marginExtras:parseFloat(d.marginExtras)||20,
  notes:d.notes||'',
};

function calcTotals(){
  let aC=0,tC=0,xC=0,eC=0;
  for(let i=0;i<Q.numDays;i++)for(let c=0;c<Q.numCats;c++){const r=(Q.accomData[i]||{})[c]||{};aC+=(parseFloat(r.units)||0)*(parseFloat(r.rate)||0);}
  for(let i=0;i<Q.numDays;i++){const r=(Q.transData[i]||[]);tC+=((parseFloat(r[1])||0)+(parseFloat(r[2])||0))*(parseFloat(r[3])||1);}
  // actData est maintenant un tableau d'objets {dayIndex, desc, rate, qty}
  if(Array.isArray(Q.actData)){
    Q.actData.forEach(r=>{xC+=(parseFloat(r.rate)||0)*(parseFloat(r.qty)||0);});
  }
  Q.extData.forEach(e=>{eC+=(parseFloat(e.rate)||0)*(parseFloat(e.qty)||1);});
  const aS=sell(aC,Q.marginAccom),tS=sell(tC,Q.marginTrans),xS=sell(xC,Q.marginAct),eS=sell(eC,Q.marginExtras);
  return{aC,tC,xC,eC,aS,tS,xS,eS,totS:aS+tS+xS+eS};
}

function buildAccomRows(){
  const rows=[];let prev=null;
  for(let i=0;i<Q.numDays;i++){
    for(let c=0;c<Q.numCats;c++){
      const r=(Q.accomData[i]||{})[c]||{};
      if(!r.hotel&&!r.city)continue;
      const key=`${r.hotel}|${r.city}|${r.roomType}|${r.units}`;
      if(prev&&prev.key===key){prev.endDay=i;}
      else{prev={key,hotel:r.hotel||'',city:r.city||'',roomType:r.roomType||'',units:r.units||0,rate:r.rate||0,startDay:i,endDay:i};rows.push(prev);}
    }
  }
  return rows;
}

function dayDate(i){
  if(!Q.arr)return'—';
  const d2=new Date(Q.arr);d2.setDate(d2.getDate()+i);
  return d2.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}

function render(){
  const T=calcTotals();
  const statusLabel={draft:'Draft',sent:'Sent',confirmed:'Confirmed'}[Q.status]||'Draft';
  const cur=Q.currency;

  // Hébergement
  const accomRows=buildAccomRows();
  const accomHTML=accomRows.length?accomRows.map(r=>{
    const dayFrom=`Day ${r.startDay+1}${r.endDay>r.startDay?'-'+(r.endDay+1):''}`;
    const dates=`${dayDate(r.startDay)} → ${dayDate(r.endDay+1)}`;
    const total=(parseFloat(r.units)||0)*(parseFloat(r.rate)||0)*((r.endDay-r.startDay)+1);
    return`<tr><td><span class="day-cell">${dayFrom}</span></td><td><span class="date-cell">${dates}</span></td><td><div class="hotel-name">${r.hotel}</div><div class="hotel-city">${r.city}</div></td><td style="font-size:10.5px;color:var(--tm);">${r.roomType}</td><td class="rt">${r.units}</td><td class="rt">${fmt(r.rate)}</td><td class="rt" style="font-weight:600;">${fmt(total)}</td></tr>`;
  }).join(''):`<tr><td colspan="7" class="empty-row">No accommodation entered</td></tr>`;

  // Transport (renommé PROPOSED ITINERARY)
  const transRows=[];
  for(let i=0;i<Q.numDays;i++){
    const r=(Q.transData[i]||[]);
    if(r[0]){
      const total=((parseFloat(r[1])||0)+(parseFloat(r[2])||0))*(parseFloat(r[3])||1);
      transRows.push(`<tr><td class="day-cell">Day ${i+1}</td><td class="date-cell">${dayDate(i)}</td><td>${r[0]}</td><td class="rt">${r[1]>0?fmt(r[1]):'—'}</td><td class="rt">${r[2]>0?fmt(r[2]):'—'}</td><td class="rt">${r[3]||1}</td><td class="rt" style="font-weight:600;">${fmt(total)}</td></tr>`);
    }
  }
  const transHTML=transRows.length?transRows.join(''):`<tr><td colspan="7" class="empty-row">No transport entered</td></tr>`;

  // Meals & Experiences (ex-Activities) — maintenant tableau d'objets
  const actRows=[];
  if(Array.isArray(Q.actData)){
    Q.actData.forEach(r=>{
      if(r.desc){
        actRows.push(`<tr><td class="day-cell">Day ${(r.dayIndex||0)+1}</td><td class="date-cell">${dayDate(r.dayIndex||0)}</td><td>${r.desc}</td><td class="rt">${fmt(r.rate||0)}</td><td class="rt">${r.qty||0}</td><td class="rt" style="font-weight:600;">${fmt((parseFloat(r.rate)||0)*(parseFloat(r.qty)||0))}</td></tr>`);
      }
    });
  }
  const actHTML=actRows.length?actRows.join(''):`<tr><td colspan="6" class="empty-row">No activity entered</td></tr>`;

  // Other Services (ex-Extras) — affiché sur le preview mais pas dans le proposal
  const extRows=Q.extData.filter(e=>e.desc).map(e=>`<tr><td style="font-weight:500;">${e.desc}</td><td class="rt">${fmt(e.rate||0)}</td><td class="rt">${e.qty||1}</td><td class="rt" style="font-weight:600;">${fmt((parseFloat(e.rate)||0)*(parseFloat(e.qty)||1))}</td></tr>`).join('');
  const extHTML=extRows||`<tr><td colspan="4" class="empty-row">No service entered</td></tr>`;

  // Including
  const DEFAULT_INC=['Accommodation at hotels as shown above or Similar','All meals as indicated','A/C Private deluxe vehicle at disposal','High qualified English Speaking guide throughout','All visits and activities as per the Itinerary','Entrance fees to the monuments','Water in the car during the tour','All Local Taxes'];
  const DEFAULT_EXCL=['Drinks during meals','Personal Expenses','Tips for the Driver, Porters & Guide'];
  const incList=(Q.incLines&&Q.incLines.length)?Q.incLines:DEFAULT_INC;
  const incHTML=incList.map(l=>`<div class="inc-chip">${l}</div>`).join('')+
    `<div style="width:100%;margin-top:8px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--rd);">Not included</div>`+
    DEFAULT_EXCL.map(l=>`<div class="inc-chip" style="border-color:#FECACA;background:#FFF5F5;"><span style="color:var(--rd)">✗</span> ${l}</div>`).join('');

  const perPax=T.totS/Q.rate/Q.pax;

  document.getElementById('quotation-page').innerHTML=`
    <div class="qh">
      <div><div class="qh-logo">Visit Morocco</div><div class="qh-sub">Travel & Events</div></div>
      <div class="qh-right"><div class="qh-type">Quotation</div><div class="qh-ref">Ref : ${Q.ref} · ${Q.version} · ${Q.date}</div></div>
    </div>

const API_URL='https://fitplanning.onrender.com';
let selLangCode='en';

function selLang(lang){selLangCode=lang;['en','fr','es','pt'].forEach(l=>document.getElementById(`lc-${l}`).className=`lang-card${l===lang?' active':''}`);}
function openMo(id){document.getElementById(id).classList.add('open');}
function closeMo(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(mo=>mo.addEventListener('click',e=>{if(e.target===mo)mo.classList.remove('open');}));
function showToast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className=`toast ${type} show`;setTimeout(()=>t.className='toast',3500);}

function amountToWords(amount,currency){
  const ONES=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function b(n){if(n<20)return ONES[n];if(n<100)return TENS[Math.floor(n/10)]+(ONES[n%10]?' '+ONES[n%10]:'');return ONES[Math.floor(n/100)]+' Hundred'+(n%100?' '+b(n%100):'');}
  amount=Math.round(amount*100)/100;const main=Math.floor(amount),cents=Math.round((amount-main)*100);
  const parts=[];
  if(Math.floor(main/1e9))parts.push(b(Math.floor(main/1e9))+' Billion');
  if(Math.floor((main%1e9)/1e6))parts.push(b(Math.floor((main%1e9)/1e6))+' Million');
  if(Math.floor((main%1e6)/1e3))parts.push(b(Math.floor((main%1e6)/1e3))+' Thousand');
  if(main%1e3)parts.push(b(main%1e3));
  let res=parts.length?parts.join(' '):'Zero';
  if(cents)res+=` And ${b(cents)} Cents`;
  return res+` ${currency==='EUR'?'Euros':'US Dollars'} Only`;
}

async function doGenerateInvoice(){
  const QQ=window._QUOTE_FOR_INVOICE||Q;
  const btn=document.getElementById('btnGenInvoice');
  btn.innerHTML='<span class="spinner"></span> Generating...';btn.disabled=true;
  try{
    const payload={currency:QQ.currency,pax:QQ.pax,totalSell:QQ.totalSellMad,eurRate:QQ.rate,ref:QQ.ref,client:QQ.client,contact:QQ.contact,paxNames:`${QQ.paxNames} x${QQ.pax}`,agentDisplay:QQ.agent,arr:QQ.arr,dep:QQ.dep,numDays:QQ.numDays,numCats:QQ.numCats||1,accomData:QQ.accomData,mealsData:QQ.mealsData,transData:QQ.transData,actData:QQ.actData,extData:QQ.extData,incLines:QQ.incLines};
    const resp=await fetch(`${API_URL}/generate-invoice`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!resp.ok)throw new Error(`Server error: ${resp.status}`);
    const blob=await resp.blob();const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`Invoice_${QQ.ref}_${QQ.client.replace(/\s/g,'_')}.xlsx`;a.click();URL.revokeObjectURL(url);
    showToast(`✅ Invoice ${QQ.ref} generated`,'success');
    closeMo('moInvoice');
  }catch(e){showToast('⚠ Backend not connected — try again in 30s','error');console.error(e);}
  finally{btn.innerHTML='📊 Generate Excel Invoice';btn.disabled=false;}
}

async function doGenerateProposal(){
  const QQ=window._QUOTE_FOR_INVOICE||Q;
  const btn=document.getElementById('btnGenProposal');btn.innerHTML='<span class="spinner"></span> Generating...';btn.disabled=true;

  const TRAD={
    en:{dear:'Dear',intro1:'Thank you for your email.',intro2:'Kindly find below our proposal along with the rates. Please feel free to share any comments or let me know if any adjustments are needed.',accommodation:'Accommodation',itinerary:'Proposed Itinerary',mealsExp:'Meals & Experiences',included:'Services Included',notIncluded:'Not Included',total:'NET QUOTE',perPax:'Per Person',closing:'Looking forward to hearing from you',regards:'Regards'},
    fr:{dear:'Cher/Chère',intro1:'Merci pour votre email.',intro2:'Veuillez trouver ci-dessous notre proposition ainsi que les tarifs.',accommodation:'Hébergement',itinerary:'Programme Proposé',mealsExp:'Repas & Expériences',included:'Services Inclus',notIncluded:'Non Inclus',total:'TOTAL NET',perPax:'Par Personne',closing:"Dans l'attente de votre retour",regards:'Cordialement'},
    es:{dear:'Estimado/a',intro1:'Gracias por su correo.',intro2:'A continuación encontrará nuestra propuesta junto con las tarifas.',accommodation:'Alojamiento',itinerary:'Itinerario Propuesto',mealsExp:'Comidas & Experiencias',included:'Servicios Incluidos',notIncluded:'No Incluido',total:'TOTAL NETO',perPax:'Por Persona',closing:'Quedamos a la espera de sus noticias',regards:'Atentamente'},
    pt:{dear:'Caro/a',intro1:'Obrigado pelo e-mail.',intro2:'Encontre abaixo nossa proposta junto com as tarifas.',accommodation:'Hospedagem',itinerary:'Itinerário Proposto',mealsExp:'Refeições & Experiências',included:'Serviços Incluídos',notIncluded:'Não Incluído',total:'TOTAL LÍQUIDO',perPax:'Por Pessoa',closing:'Aguardamos seu retorno',regards:'Atenciosamente'},
  };
  const t=TRAD[selLangCode]||TRAD.en;
  const totalRaw=QQ.totalSellMad/QQ.rate;
  const total=Math.ceil(totalRaw/10)*10;
  const perPax=Math.ceil((totalRaw/QQ.pax)/10)*10;
  const cur=QQ.currency;
  const fmtD=s=>{try{return new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return s||'';}};

  // 1. Hébergement
  const accomLines=[];let prev=null;
  for(let i=0;i<QQ.numDays;i++){
    for(let c=0;c<(QQ.numCats||1);c++){
      const r=((QQ.accomData||{})[i]||{})[c]||{};
      if(!r.hotel&&!r.city)continue;
      const key=`${r.hotel}|${r.city}|${r.roomType}`;
      if(prev&&prev.key===key){prev.end=i;}
      else{prev={key,hotel:r.hotel||'',city:r.city||'',room:r.roomType||'',units:r.units||'',start:i,end:i};accomLines.push(prev);}
    }
  }
  const accomText=accomLines.map(r=>{
    const d1=new Date(QQ.arr||'');d1.setDate(d1.getDate()+r.start);
    const d2=new Date(QQ.arr||'');d2.setDate(d2.getDate()+r.end+1);
    const from=d1.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
    const to=d2.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
    return`   ${from} - ${to} : ${r.city} - ${r.hotel}${r.room?' ('+r.room+')':''}${r.units>0?' - '+r.units+' unit(s)':''}`;
  });

  // 2. Transport (Proposed Itinerary)
  const transLines=[];
  for(let i=0;i<QQ.numDays;i++){
    const r=(QQ.transData[i]||[]);
    if(r[0]){const dt=new Date(QQ.arr||'');dt.setDate(dt.getDate()+i);transLines.push(`   Day ${i+1} (${dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}) : ${r[0]}`);}
  }

  // 3. Meals & Experiences (actData — tableau d'objets)
  const mealsExpLines=[];
  if(Array.isArray(QQ.actData)){
    QQ.actData.forEach(r=>{
      if(r.desc){
        const dt=new Date(QQ.arr||'');dt.setDate(dt.getDate()+(r.dayIndex||0));
        mealsExpLines.push(`   Day ${(r.dayIndex||0)+1} (${dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}) : ${r.desc}`);
      }
    });
  }

  // Including
  const INC_TRANS={
    en:{inc:['Accommodation at hotels as shown above or Similar','All meals as indicated','A/C Private deluxe vehicle at disposal','High qualified English Speaking guide throughout','All visits and activities as per the Itinerary','Entrance fees to the monuments','Water in the car during the tour','All Local Taxes'],excl:['Drinks during meals','Personal Expenses','Tips for the Driver, Porters & Guide']},
    fr:{inc:['Hebergement dans les hotels indiques ou similaires','Tous les repas indiques','Vehicule de luxe A/C a disposition','Guide anglophone hautement qualifie','Toutes les visites et activites selon le programme','Droits entree aux monuments','Eau dans le vehicule','Toutes les taxes locales'],excl:['Boissons pendant les repas','Depenses personnelles','Pourboires pour le chauffeur, porteurs et guide']},
    es:{inc:['Alojamiento en hoteles indicados o similares','Todas las comidas indicadas','Vehículo de lujo A/C a disposición','Guía anglófono altamente cualificado','Todas las visitas y actividades según el itinerario','Entradas a los monumentos','Agua en el vehículo','Todos los impuestos locales'],excl:['Bebidas durante las comidas','Gastos personales','Propinas para el conductor, maleteros y guía']},
    pt:{inc:['Hospedagem nos hotéis indicados ou similares','Todas as refeições indicadas','Veículo de luxo A/C à disposição','Guia anglófono altamente qualificado','Todas as visitas e atividades conforme o itinerário','Ingressos aos monumentos','Água no veículo','Todos os impostos locais'],excl:['Bebidas durante as refeições','Despesas pessoais','Gorjetas para o motorista, carregadores e guia']},
  };
  const langInc=INC_TRANS[selLangCode]||INC_TRANS.en;
  const incList=(QQ.incLines&&QQ.incLines.length)?QQ.incLines:langInc.inc;

  const sep='─'.repeat(50);
  const lines=[
    `${t.dear} ${QQ.contact||QQ.client||''},`,
    '',
    t.intro1,
    '',
    t.intro2,
    '',
    sep,
    `📋 PROGRAM : ${QQ.ref} | ${fmtD(QQ.arr)} → ${fmtD(QQ.dep)} | ${QQ.numDays} days | ${QQ.pax} pax`,
    sep,
    '',
  ];

  // PROPOSED ITINERARY — Accommodation
  if(accomText.length){
    lines.push(`🏨 ${t.accommodation.toUpperCase()}:`);
    lines.push(...accomText);
    lines.push('');
  }

  // PROPOSED ITINERARY — Transport
  if(transLines.length){
    lines.push(`🚗 ${t.itinerary.toUpperCase()}:`);
    lines.push(...transLines);
    lines.push('');
  }

  // MEALS & EXPERIENCES
  if(mealsExpLines.length){
    lines.push(`🎭 ${t.mealsExp.toUpperCase()}:`);
    lines.push(...mealsExpLines);
    lines.push('');
  }

  // Other Services → PAS affiché dans le proposal

  lines.push(sep);
  lines.push(`✅ ${t.included.toUpperCase()}:`);
  incList.forEach(l=>lines.push(`   ✓ ${l}`));
  lines.push('');
  lines.push(`❌ ${t.notIncluded.toUpperCase()}:`);
  langInc.excl.forEach(l=>lines.push(`   ✗ ${l}`));
  lines.push(sep);
  lines.push('');
  lines.push(`💰 ${t.total} : ${total.toLocaleString('en-US',{minimumFractionDigits:0})} ${cur}`);
  lines.push(`   ${t.perPax} : ${perPax.toLocaleString('en-US',{minimumFractionDigits:0})} ${cur}  (${QQ.pax} pax)`);
  lines.push('');
  lines.push(t.closing);
  lines.push('');
  lines.push(t.regards);
  lines.push('');
  // Juste le nom de l'agent
  lines.push(QQ.agent);
  lines.push('Incoming Department | Visit Morocco Travel & Events');

  try{
    const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;
    a.download=`Proposal_${selLangCode.toUpperCase()}_${QQ.ref}_${QQ.client||'Client'}.txt`;a.click();URL.revokeObjectURL(url);
    showToast(`✅ Proposal generated — ready to paste into Gmail`,'success');
    closeMo('moProposal');
  }finally{btn.innerHTML='📝 Generate Proposal';btn.disabled=false;}
}
